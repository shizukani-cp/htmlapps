    let kanaTable = {};
    let currentQuestion = {};
    let typed = "";
    let buffer = "";

    function applyTable() {
      try {
        const raw = document.getElementById("tableInput").value;
        kanaTable = JSON.parse(raw.replace(/'/g, '"').replace(/\/\/.*$/gm, ""));
        console.log("テーブル読み込みに成功しました");
        resetGame();
      } catch (e) {
        alert('形式が正しくありません。JSONオブジェクト形式 { "key": ["かな", "next"], ... } で書いてください。');
      }
    }

    function resetGame() {
      const qIdx = Math.floor(Math.random() * questions.length);
      currentQuestion = questions[qIdx];
      typed = "";
      buffer = "";
      updateUI();
    }

    function updateUI() {
      document.getElementById("targetKanji").innerText = currentQuestion.kanji || "";
      document.getElementById("targetKana").innerText = currentQuestion.kana || "";
      document.getElementById("typedKana").innerText = typed;
      document.getElementById("currentBuffer").innerText = buffer;
    }

    window.addEventListener("keydown", (e) => {
      // 1. 設定エリア等の入力中は無視
      if (["TEXTAREA", "INPUT"].includes(e.target.tagName)) return;
      if (e.ctrlKey || e.metaKey) return;

      // 2. バックスペース処理
      if (e.key === "Backspace") {
        e.preventDefault();
        buffer = buffer.slice(0, -1);
        updateUI();
        return;
      }

      if (e.key.length !== 1) return;

      const nextBuffer = buffer + e.key;
      const keys = Object.keys(kanaTable);
      const targetKana = currentQuestion.kana;

      // 3. 完全一致ルールがあるか判定
      const exactValue = kanaTable[nextBuffer];

      // 4. より長いキー候補が存在するかチェック（'k' に対する 'ka', 'kyu' など）
      const hasLongerCandidate = keys.some(k => k.startsWith(nextBuffer) && k !== nextBuffer);

      // 5. より長い候補があるなら保留して次入力待ち
      if (hasLongerCandidate) {
        buffer = nextBuffer;
        updateUI();
        return;
      }

      // 6. 最長候補がなく、完全一致する場合に確定処理を実行
      if (exactValue) {
        const [kana, carryOver] = exactValue;
        const newTyped = typed + kana;

        // お題（かな）と前方一致しているか確認
        if (targetKana.startsWith(newTyped)) {
          typed = newTyped;
          buffer = carryOver;

          if (typed === targetKana) {
            setTimeout(() => {
              resetGame();
            }, 100);
          }
          updateUI();
          return;
        } else {
          // お題と一致しない入力はバッファクリア
          buffer = "";
          updateUI();
          return;
        }
      }

      // 7. そもそも前方一致すら存在しない無効キー判定
      const hasPrefix = keys.some(k => k.startsWith(nextBuffer));
      if (hasPrefix) {
        buffer = nextBuffer;
      } else {
        console.log("無効なキー入力です");
        buffer = "";
      }

      updateUI();
    });

    // 初期化
    document.getElementById("tableInput").value = defaultTableSource;
    applyTable();
